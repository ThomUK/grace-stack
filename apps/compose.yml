# apps — user-facing things that are not models.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports: ["127.0.0.1:12000:8080"]
    environment:
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URLS=http://vllm-gemma:8000/v1;http://vllm-ornith15:8000/v1;http://vllm-qwen36moe:8000/v1
      - OPENAI_API_KEYS=x;x;x
    volumes:
      - open-webui:/app/backend/data

  dgx-dashboard:
    image: ghcr.io/dantup/dgx_dashboard:latest
    container_name: dgx-dashboard
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports: ["127.0.0.1:8080:8080"]   # holds the Docker socket: keep off the LAN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  open-webui:
    external: true
