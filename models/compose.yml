# grace-stack — services on grace (ASUS Ascent GX10, GB10, 128 GB unified)
#
#   vllm-gemma12   : google/gemma-4-12b-it     -> 127.0.0.1:8000   general chat, audio in
#   vllm-qwen38    : Qwen3.8-27B (NVFP4/FP8)   -> 127.0.0.1:8001   coding agent (dense; opt-in, was the default)
#                    quant + memory fraction are QWEN38_MODEL / QWEN38_GMU in .env (NVFP4 0.35, FP8 0.45)
#   vllm-qwen36moe : Qwen3.6-35B-A3B-NVFP4     -> 127.0.0.1:8002   coding agent (mixture of experts)
#   vllm-ornith15  : Ornith-1.5-35B-A3B (NVFP4) -> 127.0.0.1:8003  coding agent (default; mixture of experts)
#                    which quant is ORNITH_MODEL in .env; the served name stays `ornith-1.5-35b-a3b`
#   vllm-codernext : Qwen3-Coder-Next (80B-A3B) -> 127.0.0.1:8004  coding agent, non-thinking; opt-in
#                    quant + memory fraction are CODERNEXT_MODEL / CODERNEXT_GMU in .env (NVFP4 0.45, FP8 0.72)
#
# One memory pool. GMU fractions must sum < ~0.85.
# Ports bind to loopback; expose with `tailscale serve`, not the LAN.

x-vllm: &vllm
  build: ./vllm
  image: grace/vllm
  restart: unless-stopped
  ipc: host
  runtime: nvidia
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - HF_TOKEN=${HF_TOKEN}
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    - vllm-cache:/root/.cache/vllm      # torch.compile + CUDA graph cache: saves ~2 min per restart
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    start_period: 900s
    retries: 5

services:
  vllm-gemma12:
    <<: *vllm
    profiles: [gemma12]
    container_name: vllm-gemma12
    ports: ["127.0.0.1:8000:8000"]
    command: >
      vllm serve google/gemma-4-12b-it
      --served-model-name gemma4-12b
      --host 0.0.0.0 --port 8000
      --max-model-len 32768
      --gpu-memory-utilization 0.30
      --limit-mm-per-prompt '{"audio": 1}'
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser gemma4

  vllm-ornith15:
    <<: *vllm
    profiles: [ornith15]
    container_name: vllm-ornith15
    ports: ["127.0.0.1:8003:8000"]
    command: >
      vllm serve ${ORNITH_MODEL:-ornith-ai/Ornith-1.5-35B-A3B-NVFP4}
      --served-model-name ornith-1.5-35b-a3b
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.30
      --override-generation-config '{"temperature": 0.6}'
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3

  vllm-codernext:
    <<: *vllm
    profiles: [codernext]
    container_name: vllm-codernext
    ports: ["127.0.0.1:8004:8000"]
    command: >
      vllm serve ${CODERNEXT_MODEL:-RedHatAI/Qwen3-Coder-Next-NVFP4}
      --served-model-name qwen3-coder-next
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization ${CODERNEXT_GMU:-0.45}
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 40}'
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder

  vllm-qwen38:
    <<: *vllm
    profiles: [qwen38]
    container_name: vllm-qwen38
    ports: ["127.0.0.1:8001:8000"]
    command: >
      vllm serve ${QWEN38_MODEL:-nvidia/Qwen3.8-27B-NVFP4}
      --served-model-name qwen3.8-27b
      --host 0.0.0.0 --port 8000
      --max-model-len 131072
      --max-num-seqs 4
      --gpu-memory-utilization ${QWEN38_GMU:-0.35}
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --speculative-config '${QWEN_SPEC}'

  vllm-qwen36moe:
    <<: *vllm
    profiles: [qwen36moe]
    container_name: vllm-qwen36moe
    ports: ["127.0.0.1:8002:8000"]
    command: >
      vllm serve RedHatAI/Qwen3.6-35B-A3B-NVFP4
      --served-model-name qwen3.6-35b-a3b
      --host 0.0.0.0 --port 8000
      --max-model-len 131072
      --max-num-seqs 4
      --gpu-memory-utilization 0.25
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3

volumes:
  vllm-cache:
