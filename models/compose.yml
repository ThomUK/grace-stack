# grace-stack — models on grace (ASUS Ascent GX10, GB10, 128 GB unified)
#
# One service per model *variant*. Siblings share a host port and a served name, so clients never
# notice which quant is behind it; only one sibling can run at a time (the switchboard offers "swap").
#
#   :8000  gemma4-12b                   vllm-gemma12            google bf16             GMU 0.30  chat, audio in
#   :8001  qwen3.8-27b                  vllm-qwen38-nvfp4       nvidia modelopt NVFP4   GMU 0.35  dense coder, MTP 3 drafts (~17 tok/s)
#                                       vllm-qwen38-fp8         Qwen FP8                GMU 0.45  MTP 3 drafts
#   :8002  qwen3.6-35b-a3b              vllm-qwen36moe          RedHatAI NVFP4          GMU 0.25  MoE coder
#   :8003  ornith-1.5-35b-a3b           vllm-ornith15-nvfp4     ornith-ai NVFP4         GMU 0.30  MoE coder
#                                       vllm-ornith15-agentic   primitive-ai NVFP4-FP8  GMU 0.30  GPTQ-calibrated on tool calls (the default)
#                                       vllm-ornith15-bf16      ornith-ai bf16, 67 GiB  GMU 0.72  unquantised reference; runs alone
#   :8004  qwen3-coder-next             vllm-codernext-nvfp4    RedHatAI NVFP4          GMU 0.45  80B-A3B, non-thinking
#                                       vllm-codernext-fp8      Qwen FP8                GMU 0.72  runs alone
#   :8005  qwen3.5-122b-a10b            vllm-qwen35-122b        RedHatAI NVFP4, 71 GiB  GMU 0.75  biggest MoE here, vision; runs alone
#   :8006  nemotron-3-nano-omni-30b-a3b vllm-nemotron-omni      nvidia FP8, 33 GiB      GMU 0.45  image + video in, reasoning
#
# Memory: vLLM sees 121.6 GiB. Weights + ~7 GiB of runtime overhead come out of GMU × 121.6; the rest is
# KV cache ("Available KV cache memory" in the container log). Start models one at a time: two loading at
# once mismeasure the shared pool and one of them ends up with no KV cache (the switchboard serialises this).
#
# Every service is behind a profile named after it (minus `vllm-`), so a plain `docker compose up -d`
# leaves models alone: start them from the switchboard, or `docker compose --profile X up -d vllm-X`.
# `restart: unless-stopped` brings back whatever was running at reboot.
#
# Labels read by the switchboard:  switchboard.note (card text), switchboard.name (VS Code display name),
# switchboard.vision ("true" when there is no --limit-mm-per-prompt to infer it from),
# switchboard.card (origin URL; default https://huggingface.co/<repo>),
# switchboard.logo (Hugging Face org whose avatar is the card's logo; default the repo's owner).
#
# Ports bind to loopback; expose with `tailscale serve`, not the LAN.

x-vllm: &vllm
  build: ./vllm
  image: grace/vllm
  restart: unless-stopped
  ipc: host
  runtime: nvidia
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - HF_TOKEN=${HF_TOKEN}
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    - vllm-cache:/root/.cache/vllm      # torch.compile + CUDA graph cache: saves ~2 min per restart
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    start_period: 900s
    retries: 5

services:
  # ---------------------------------------------------------------- :8000 gemma4-12b
  vllm-gemma12:
    <<: *vllm
    profiles: [gemma12]
    container_name: vllm-gemma12
    ports: ["127.0.0.1:8000:8000"]
    labels:
      switchboard.name: "Gemma 4 12B"
      switchboard.note: "google bf16, audio in; general chat"
    command: >
      vllm serve google/gemma-4-12b-it
      --served-model-name gemma4-12b
      --host 0.0.0.0 --port 8000
      --max-model-len 32768
      --gpu-memory-utilization 0.30
      --limit-mm-per-prompt '{"audio": 1}'
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser gemma4

  # ---------------------------------------------------------------- :8001 qwen3.8-27b (dense; opt-in)
  vllm-qwen38-nvfp4:
    <<: *vllm
    profiles: [qwen38-nvfp4]
    container_name: vllm-qwen38-nvfp4
    ports: ["127.0.0.1:8001:8000"]
    labels:
      switchboard.name: "Qwen3.8-27B"
      switchboard.logo: "Qwen"
      switchboard.vision: "true"
      switchboard.note: "nvidia modelopt quant; built-in MTP, 3 drafts (~17 tok/s)"
    command: >
      vllm serve nvidia/Qwen3.8-27B-NVFP4
      --served-model-name qwen3.8-27b
      --host 0.0.0.0 --port 8000
      --max-model-len 131072
      --max-num-seqs 4
      --gpu-memory-utilization 0.35
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'

  vllm-qwen38-fp8:
    <<: *vllm
    profiles: [qwen38-fp8]
    container_name: vllm-qwen38-fp8
    ports: ["127.0.0.1:8001:8000"]
    labels:
      switchboard.name: "Qwen3.8-27B"
      switchboard.vision: "true"
      switchboard.note: "Qwen official FP8; built-in MTP, 3 drafts (~17 tok/s)"
    command: >
      vllm serve Qwen/Qwen3.8-27B-FP8
      --served-model-name qwen3.8-27b
      --host 0.0.0.0 --port 8000
      --max-model-len 131072
      --max-num-seqs 4
      --gpu-memory-utilization 0.45
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'

  # ---------------------------------------------------------------- :8002 qwen3.6-35b-a3b
  vllm-qwen36moe:
    <<: *vllm
    profiles: [qwen36moe]
    container_name: vllm-qwen36moe
    ports: ["127.0.0.1:8002:8000"]
    labels:
      switchboard.name: "Qwen3.6-35B-A3B"
      switchboard.logo: "Qwen"
      switchboard.vision: "true"
      switchboard.note: "RedHatAI NVFP4; MoE, 3B active; built-in MTP, 3 drafts"
    command: >
      vllm serve RedHatAI/Qwen3.6-35B-A3B-NVFP4
      --served-model-name qwen3.6-35b-a3b
      --host 0.0.0.0 --port 8000
      --max-model-len 131072
      --max-num-seqs 4
      --gpu-memory-utilization 0.25
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3

  # ---------------------------------------------------------------- :8003 ornith-1.5-35b-a3b
  vllm-ornith15-nvfp4:
    <<: *vllm
    profiles: [ornith15-nvfp4]
    container_name: vllm-ornith15-nvfp4
    ports: ["127.0.0.1:8003:8000"]
    labels:
      switchboard.name: "Ornith-1.5-35B-A3B"
      switchboard.vision: "true"
      switchboard.note: "ornith-ai official modelopt quant; MoE, 3B active; MTP 1 draft"
    command: >
      vllm serve ornith-ai/Ornith-1.5-35B-A3B-NVFP4
      --served-model-name ornith-1.5-35b-a3b
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.30
      --override-generation-config '{"temperature": 0.6}'
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3

  vllm-ornith15-agentic:
    <<: *vllm
    profiles: [ornith15-agentic]
    container_name: vllm-ornith15-agentic
    ports: ["127.0.0.1:8003:8000"]
    labels:
      switchboard.name: "Ornith-1.5-35B-A3B"
      switchboard.logo: "ornith-ai"
      switchboard.vision: "true"
      switchboard.note: "primitive-ai third-party quant, GPTQ-calibrated on tool calls; MTP 1 draft"
    command: >
      vllm serve primitive-ai/Ornith-1.5-35B-A3B-agentic-NVFP4-FP8
      --served-model-name ornith-1.5-35b-a3b
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.30
      --override-generation-config '{"temperature": 0.6}'
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3

  vllm-ornith15-bf16:
    <<: *vllm
    profiles: [ornith15-bf16]
    container_name: vllm-ornith15-bf16
    ports: ["127.0.0.1:8003:8000"]
    labels:
      switchboard.name: "Ornith-1.5-35B-A3B"
      switchboard.vision: "true"
      switchboard.note: "unquantised bf16 reference the NVFP4 quants were made from; runs alone. MTP 1 draft"
    command: >
      vllm serve ornith-ai/Ornith-1.5-35B-A3B
      --served-model-name ornith-1.5-35b-a3b
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.72
      --override-generation-config '{"temperature": 0.6}'
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3

  # ---------------------------------------------------------------- :8004 qwen3-coder-next (80B-A3B, non-thinking; opt-in)
  vllm-codernext-nvfp4:
    <<: *vllm
    profiles: [codernext-nvfp4]
    container_name: vllm-codernext-nvfp4
    ports: ["127.0.0.1:8004:8000"]
    labels:
      switchboard.name: "Qwen3-Coder-Next"
      switchboard.logo: "Qwen"
      switchboard.note: "RedHatAI NVFP4; fits beside one other model. No MTP weights, so no spec decode"
    command: >
      vllm serve RedHatAI/Qwen3-Coder-Next-NVFP4
      --served-model-name qwen3-coder-next
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.45
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 40}'
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder

  vllm-codernext-fp8:
    <<: *vllm
    profiles: [codernext-fp8]
    container_name: vllm-codernext-fp8
    ports: ["127.0.0.1:8004:8000"]
    labels:
      switchboard.name: "Qwen3-Coder-Next"
      switchboard.note: "Qwen official FP8; runs alone. No MTP weights, so no spec decode"
    command: >
      vllm serve Qwen/Qwen3-Coder-Next-FP8
      --served-model-name qwen3-coder-next
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.72
      --override-generation-config '{"temperature": 1.0, "top_p": 0.95, "top_k": 40}'
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder

  # ---------------------------------------------------------------- :8005 qwen3.5-122b-a10b (opt-in; runs alone)
  vllm-qwen35-122b:
    <<: *vllm
    profiles: [qwen35-122b]
    container_name: vllm-qwen35-122b
    ports: ["127.0.0.1:8005:8000"]
    labels:
      switchboard.name: "Qwen3.5-122B-A10B"
      switchboard.logo: "Qwen"
      switchboard.vision: "true"
      switchboard.note: "RedHatAI NVFP4 of the 122B MoE (10B active), vision in; MTP 2 drafts; runs alone"
    command: >
      vllm serve RedHatAI/Qwen3.5-122B-A10B-NVFP4
      --served-model-name qwen3.5-122b-a10b
      --host 0.0.0.0 --port 8000
      --max-model-len 262144
      --max-num-seqs 4
      --gpu-memory-utilization 0.75
      --limit-mm-per-prompt '{"image": 2}'
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3

  # ---------------------------------------------------------------- :8006 nemotron-3-nano-omni-30b-a3b (opt-in)
  vllm-nemotron-omni:
    <<: *vllm
    profiles: [nemotron-omni]
    container_name: vllm-nemotron-omni
    ports: ["127.0.0.1:8006:8000"]
    labels:
      switchboard.name: "Nemotron 3 Nano Omni 30B-A3B"
      switchboard.note: "nvidia FP8; Mamba2-Transformer hybrid MoE, 3B active; image + video in (audio needs vllm[audio], not in the image); fp8 KV cache"
    command: >
      vllm serve nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8
      --served-model-name nemotron-3-nano-omni-30b-a3b
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --max-model-len 131072
      --max-num-seqs 4
      --max-num-batched-tokens 32768
      --gpu-memory-utilization 0.45
      --kv-cache-dtype fp8
      --limit-mm-per-prompt '{"image": 1, "video": 1}'
      --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}'
      --video-pruning-rate 0.5
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser nemotron_v3

volumes:
  vllm-cache:
