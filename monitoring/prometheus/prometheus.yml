global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: [vllm-gemma12:8000]
        labels: { service: vllm-gemma12 }
      - targets: [vllm-qwen38-nvfp4:8000]
        labels: { service: vllm-qwen38-nvfp4 }
      - targets: [vllm-qwen38-fp8:8000]
        labels: { service: vllm-qwen38-fp8 }
      - targets: [vllm-qwen36moe:8000]
        labels: { service: vllm-qwen36moe }
      - targets: [vllm-ornith15-nvfp4:8000]
        labels: { service: vllm-ornith15-nvfp4 }
      - targets: [vllm-ornith15-agentic:8000]
        labels: { service: vllm-ornith15-agentic }
      - targets: [vllm-ornith15-bf16:8000]
        labels: { service: vllm-ornith15-bf16 }
      - targets: [vllm-codernext-nvfp4:8000]
        labels: { service: vllm-codernext-nvfp4 }
      - targets: [vllm-codernext-fp8:8000]
        labels: { service: vllm-codernext-fp8 }
      - targets: [vllm-qwen35-122b:8000]
        labels: { service: vllm-qwen35-122b }
      - targets: [vllm-nemotron-omni:8000]
        labels: { service: vllm-nemotron-omni }

  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
